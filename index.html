<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satranç Notasyonu → PGN Dönüştürücü</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            background: #4a5568;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(56, 239, 125, 0.4);
        }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }
        .preview-img {
            max-height: 300px;
            object-fit: contain;
        }
    </style>
</head>
<body class="text-white p-4">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8 pt-4">
            <h1 class="text-3xl font-bold mb-2">♟️ Satranç Notasyonu Okuyucu</h1>
            <p class="text-gray-400">Notasyon kağıdınızın fotoğrafını yükleyin, AI okusun, PGN oluştursun</p>
        </div>

        <!-- Step 1: Upload -->
        <div id="step1" class="glass rounded-2xl p-6 mb-4">
            <div class="flex items-center gap-3 mb-4">
                <span class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">1</span>
                <h2 class="text-xl font-semibold">Fotoğraf Yükle</h2>
            </div>
            
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            
            <div id="uploadArea" class="text-center">
                <button onclick="document.getElementById('fileInput').click()" 
                        class="btn-primary text-white px-8 py-4 rounded-xl font-semibold text-lg w-full mb-3">
                    📁 Dosyalardan Fotoğraf Seç
                </button>
                
                <div id="previewContainer" class="hidden mt-4">
                    <img id="preview" class="preview-img rounded-lg mx-auto mb-3">
                    <p id="fileName" class="text-gray-400 text-sm"></p>
                    <button onclick="document.getElementById('fileInput').click()" 
                            class="text-purple-400 text-sm underline mt-2">Değiştir</button>
                </div>
            </div>
            
            <button id="readBtn" onclick="readNotation()" disabled
                    class="btn-primary text-white px-8 py-4 rounded-xl font-semibold text-lg w-full mt-4 flex items-center justify-center gap-3">
                <span id="readBtnText">🔍 Oku</span>
                <div id="readLoader" class="loader hidden"></div>
            </button>
        </div>

        <!-- Step 2: Edit -->
        <div id="step2" class="glass rounded-2xl p-6 mb-4 hidden">
            <div class="flex items-center gap-3 mb-4">
                <span class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">2</span>
                <h2 class="text-xl font-semibold">Hamleleri Kontrol Et</h2>
            </div>
            
            <p id="modelUsed" class="text-green-400 text-sm mb-3"></p>
            
            <p class="text-gray-400 text-sm mb-3">
                AI'ın okuduğu hamleler aşağıda. <span class="text-yellow-400">[?]</span> işaretli olanlar şüpheli — düzeltebilirsiniz.
            </p>
            
            <textarea id="movesArea" rows="8" 
                      class="w-full rounded-lg p-4 text-white font-mono text-sm resize-none"></textarea>
            
            <!-- Maç Bilgileri Formu -->
            <div class="mt-6 p-4 bg-white/5 rounded-xl border border-white/10">
                <h3 class="text-lg font-semibold mb-4">🏆 Maç Bilgileri</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Turnuva Adı</label>
                        <input type="text" id="inputEvent" value="Turnuva" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Tur</label>
                        <input type="text" id="inputRound" value="1" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Masa</label>
                        <input type="text" id="inputBoard" value="1" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Sonuç</label>
                        <select id="inputResult" 
                                class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                            <option value="*">Devam ediyor (*)</option>
                            <option value="1-0">Beyaz kazandı (1-0)</option>
                            <option value="0-1">Siyah kazandı (0-1)</option>
                            <option value="1/2-1/2">Berabere (½-½)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Beyaz Oyuncu</label>
                        <input type="text" id="inputWhite" placeholder="İsim girin" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Siyah Oyuncu</label>
                        <input type="text" id="inputBlack" placeholder="İsim girin" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Beyaz ELO</label>
                        <input type="text" id="inputWhiteElo" placeholder="Ör: 1500" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Siyah ELO</label>
                        <input type="text" id="inputBlackElo" placeholder="Ör: 1500" 
                               class="w-full bg-black/30 border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                    </div>
                </div>
            </div>
            
            <button onclick="generatePGN()" 
                    class="btn-primary text-white px-8 py-4 rounded-xl font-semibold text-lg w-full mt-4">
                📄 PGN Oluştur
            </button>
        </div>

        <!-- Step 3: Result -->
        <div id="step3" class="glass rounded-2xl p-6 hidden">
            <div class="flex items-center gap-3 mb-4">
                <span class="bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">✓</span>
                <h2 class="text-xl font-semibold">PGN Hazır!</h2>
            </div>
            
            <pre id="pgnOutput" class="bg-black/50 rounded-lg p-4 text-green-400 font-mono text-sm overflow-x-auto whitespace-pre-wrap mb-4"></pre>
            
            <button onclick="copyPGN()" 
                    class="btn-success text-white px-8 py-5 rounded-xl font-bold text-xl w-full flex items-center justify-center gap-3">
                <span id="copyBtnText">📋 KOPYALA</span>
            </button>
            
            <button onclick="startOver()" 
                    class="text-gray-400 underline w-full mt-4 py-2">
                Yeni Fotoğraf Yükle
            </button>
        </div>

        <!-- Error Display -->
        <div id="errorBox" class="hidden bg-red-900/50 border border-red-500 rounded-xl p-4 mt-4">
            <p id="errorText" class="text-red-300"></p>
        </div>
    </div>

    <script>
        // Global state
        let selectedFile = null;
        let imageDataUrl = null;

        // AI Prompt - English and clear context to avoid content rejection
        const AI_PROMPT = `You are a chess notation transcription expert. Your task is to read the handwritten chess moves from this chess scoresheet photograph.

This is a standard chess game scoresheet with algebraic notation moves written by hand during a chess tournament.

Instructions:
1. Convert Turkish piece letters to English if present: Ş = K (King), V = Q (Queen), K = R (Rook), F = B (Bishop), A = N (Knight). Pawns have no letter prefix.
2. For castling: Write O-O for kingside, O-O-O for queenside (letter O, not zero).
3. Return ONLY the move list in this format: 1. e4 e5 2. Nf3 Nc6 3. Bb5 a6...
4. Do NOT add any explanation or commentary - output only chess moves.
5. Mark unclear or illegible moves with [?] symbol.

Transcribe all chess moves from this scoresheet image:`;

        // Models to try - Claude and Gemini first (less restrictive), then GPT
        const MODELS = [
            'claude-3-5-sonnet',
            'claude-sonnet-4',
            'google/gemini-2.0-flash',
            'gemini-2.0-flash',
            'google/gemini-2.5-flash',
            'gpt-4o-mini',
            'gpt-4o',
            'meta-llama/llama-4-maverick'
        ];

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                
                // Convert to base64 data URL for API
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageDataUrl = event.target.result;
                    
                    // Show preview
                    document.getElementById('preview').src = imageDataUrl;
                    document.getElementById('fileName').textContent = file.name;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('readBtn').disabled = false;
                };
                reader.readAsDataURL(file);
                
                hideError();
            }
        });

        // Read notation with AI
        async function readNotation() {
            if (!imageDataUrl) {
                showError('Lütfen önce bir fotoğraf seçin.');
                return;
            }

            const readBtn = document.getElementById('readBtn');
            const readBtnText = document.getElementById('readBtnText');
            const readLoader = document.getElementById('readLoader');

            readBtn.disabled = true;
            readBtnText.textContent = 'Okunuyor...';
            readLoader.classList.remove('hidden');
            hideError();

            let lastError = null;
            let successModel = null;

            for (const model of MODELS) {
                try {
                    console.log(`Trying model: ${model}`);
                    readBtnText.textContent = `Deneniyor: ${model}`;
                    
                    // Puter.js format: puter.ai.chat(prompt, imageURL, {model})
                    const response = await puter.ai.chat(AI_PROMPT, imageDataUrl, { model: model });
                    
                    // Extract text from response
                    let text = '';
                    if (typeof response === 'string') {
                        text = response;
                    } else if (response && response.message) {
                        if (typeof response.message.content === 'string') {
                            text = response.message.content;
                        } else if (Array.isArray(response.message.content)) {
                            text = response.message.content
                                .filter(c => c.type === 'text')
                                .map(c => c.text)
                                .join('');
                        }
                    } else if (response && response.text) {
                        text = response.text;
                    } else if (response && typeof response.toString === 'function') {
                        text = response.toString();
                        if (text === '[object Object]') {
                            text = JSON.stringify(response);
                        }
                    }

                    // Check if response is valid (not an error or refusal)
                    const isRefusal = text.toLowerCase().includes("sorry") || 
                                      text.toLowerCase().includes("can't assist") ||
                                      text.toLowerCase().includes("cannot assist") ||
                                      text.toLowerCase().includes("i'm unable") ||
                                      text.toLowerCase().includes("not able to");
                    
                    if (text && text.trim() && !text.includes('"error"') && !isRefusal) {
                        successModel = model;
                        document.getElementById('movesArea').value = text.trim();
                        document.getElementById('modelUsed').textContent = `✓ ${model} ile okundu`;
                        document.getElementById('step2').classList.remove('hidden');
                        break;
                    } else if (isRefusal) {
                        console.log(`Model ${model} refused the request`);
                        lastError = { message: `${model} isteği reddetti` };
                        continue;
                    }
                } catch (err) {
                    console.log(`Model ${model} failed:`, err);
                    lastError = err;
                    continue;
                }
            }

            readBtn.disabled = false;
            readBtnText.textContent = '🔍 Oku';
            readLoader.classList.add('hidden');

            if (!successModel) {
                let errorMsg = 'Tüm modeller denendi, hata oluştu: ';
                if (lastError) {
                    if (typeof lastError === 'object') {
                        if (lastError.message) {
                            errorMsg += lastError.message;
                        } else {
                            errorMsg += JSON.stringify(lastError);
                        }
                    } else {
                        errorMsg += String(lastError);
                    }
                } else {
                    errorMsg += 'Bilinmeyen hata';
                }
                showError(errorMsg);
            }
        }

        // Generate PGN
        function generatePGN() {
            const moves = document.getElementById('movesArea').value.trim();
            
            if (!moves) {
                showError('Hamleler boş olamaz.');
                return;
            }

            // Form alanlarından değerleri al
            const eventName = document.getElementById('inputEvent').value.trim() || 'Turnuva';
            const round = document.getElementById('inputRound').value.trim() || '1';
            const board = document.getElementById('inputBoard').value.trim() || '1';
            const white = document.getElementById('inputWhite').value.trim() || '?';
            const black = document.getElementById('inputBlack').value.trim() || '?';
            const whiteElo = document.getElementById('inputWhiteElo').value.trim() || '?';
            const blackElo = document.getElementById('inputBlackElo').value.trim() || '?';
            const result = document.getElementById('inputResult').value || '*';

            const pgn = `[Event "${eventName}"]
[Round "${round}"]
[Board "${board}"]
[White "${white}"]
[Black "${black}"]
[WhiteElo "${whiteElo}"]
[BlackElo "${blackElo}"]
[Result "${result}"]

${moves} ${result !== '*' ? result : ''}`.trim();

            document.getElementById('pgnOutput').textContent = pgn;
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }

        // Copy PGN
        async function copyPGN() {
            const pgn = document.getElementById('pgnOutput').textContent;
            const copyBtnText = document.getElementById('copyBtnText');
            
            try {
                await navigator.clipboard.writeText(pgn);
                copyBtnText.textContent = '✓ KOPYALANDİ!';
                setTimeout(() => {
                    copyBtnText.textContent = '📋 KOPYALA';
                }, 2000);
            } catch (err) {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = pgn;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyBtnText.textContent = '✓ KOPYALANDİ!';
                setTimeout(() => {
                    copyBtnText.textContent = '📋 KOPYALA';
                }, 2000);
            }
        }

        // Start over
        function startOver() {
            selectedFile = null;
            imageDataUrl = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('preview').src = '';
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('readBtn').disabled = true;
            document.getElementById('movesArea').value = '';
            document.getElementById('pgnOutput').textContent = '';
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('modelUsed').textContent = '';
            hideError();
        }

        // Error handling
        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorBox').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }
    </script>
</body>
</html>
